map $http_x_forwarded_proto $peergrab_forwarded_proto {
    default $scheme;
    https https;
}

# Re-resolve Docker service IPs after a container is replaced while reusing
# established upstream HTTP connections during normal operation.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream peergrab_app {
    zone peergrab_app 64k;
    server app:8080 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://peergrab_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $peergrab_forwarded_proto;
    }

    location = /ws {
        # WebSocket token travels in the query string; never write it to access logs.
        access_log off;
        proxy_pass http://peergrab_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $peergrab_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
