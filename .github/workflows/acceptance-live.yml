name: Live acceptance (manual/scheduled)

# 真实栈验收：compose 中间件 + 容器内 API/Worker（与生产部署形态一致，MQ 可用）
# + Vite dev + Playwright。手动触发或每周定时运行，避免拖慢每次 PR。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PEERGRAB_ACCEPTANCE_PROJECT: peergrab-live
      PEERGRAB_MYSQL_PASSWORD: acceptance-only-db-password
      PEERGRAB_AUTH_DEMO_PASSWORD_1001: demo1001
      PEERGRAB_AUTH_DEMO_PASSWORD_2001: demo2001
      PEERGRAB_AUTH_DEMO_PASSWORD_2002: demo2002
      PEERGRAB_AUTH_DEMO_PASSWORD_9001: demo9001
      PEERGRAB_LIVE_CONFIRM_SECONDS: '3'
      PEERGRAB_LIVE_AUTO_SETTLE_SECONDS: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'peergrab-backend/**/pom.xml'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: peergrab-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build backend jars
        run: mvn -B -ntp -DskipTests package
        working-directory: peergrab-backend

      - name: Start disposable acceptance backend
        run: |
          mkdir -p peergrab-frontend/verification/live-ci
          bash peergrab-backend/docker/run-live-acceptance.sh up

      - name: Start Vite dev server
        run: |
          npm ci --no-audit --no-fund
          nohup npm run dev > /tmp/peergrab-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then echo "vite ready"; exit 0; fi
            sleep 2
          done
          tail -60 /tmp/peergrab-vite.log
          exit 1
        working-directory: peergrab-frontend

      - name: Install acceptance dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium

      - name: Live API acceptance (concurrency, idempotency, timeout, auto-settle)
        run: |
          python3 peergrab-frontend/tests/live_api_smoke.py \
            --base http://127.0.0.1:8080 \
            --timeout-flow --auto-settle-flow \
            --output peergrab-frontend/verification/live-ci
      - name: Live browser acceptance (four demo identities)
        run: |
          python3 peergrab-frontend/tests/live_smoke.py \
            --base http://127.0.0.1:5173 --api-base http://127.0.0.1:8080 \
            --output peergrab-frontend/verification/live-ci
      - name: Fund invariants (read-only SQL)
        run: |
          docker compose -p peergrab-live -f peergrab-backend/docker/docker-compose.yaml --env-file /dev/null exec -T mysql \
            sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql --default-character-set=utf8mb4 -uroot peer_grab' \
            < peergrab-backend/bench/scripts/verify_fund.sql \
            > peergrab-frontend/verification/live-ci/fund-invariants-result.txt
          cat peergrab-frontend/verification/live-ci/fund-invariants-result.txt

      - name: Collect runtime logs into the evidence directory
        if: always()
        run: |
          docker logs peergrab-live-app > peergrab-frontend/verification/live-ci/app.log 2>&1 || true
          docker logs peergrab-live-worker > peergrab-frontend/verification/live-ci/worker.log 2>&1 || true
          if [ -f /tmp/peergrab-vite.log ]; then cp /tmp/peergrab-vite.log peergrab-frontend/verification/live-ci/vite.log; fi
          ls -la peergrab-frontend/verification/live-ci || true

      - name: Upload live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-evidence
          path: peergrab-frontend/verification/live-ci
          if-no-files-found: warn

      - name: Stop acceptance stack
        if: always()
        run: |
          pkill -f 'vite' || true
          bash peergrab-backend/docker/run-live-acceptance.sh down || true
