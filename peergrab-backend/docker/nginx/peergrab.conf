# Host Nginx site after certbot has issued /etc/letsencrypt/live/peergrab.cn/*.
# Only 80/443 are public. Docker publishes the app frontend on 127.0.0.1:25173.
limit_req_zone $binary_remote_addr zone=peergrab_login:10m rate=10r/m;

server {
    listen 80;
    server_name peergrab.cn www.peergrab.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.peergrab.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name peergrab.cn;

    # The certificate must include both peergrab.cn and www.peergrab.cn.
    ssl_certificate /etc/letsencrypt/live/peergrab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peergrab.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.peergrab.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name www.peergrab.cn;

    ssl_certificate /etc/letsencrypt/live/peergrab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peergrab.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/internal {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=peergrab_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:25173;
    }

    location = /ws {
        # The browser sends its bearer token in the WebSocket URL; do not log it.
        access_log off;
        proxy_pass http://127.0.0.1:25173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:25173;
    }
}
