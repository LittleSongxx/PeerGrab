# Temporary host Nginx site. Serve only ACME challenges until the certificate exists.
# Install as /etc/nginx/sites-available/peergrab.cn and enable it before certbot.
server {
    listen 80;
    server_name peergrab.cn www.peergrab.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
