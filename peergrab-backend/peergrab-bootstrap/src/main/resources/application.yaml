server:
  port: 8080
  tomcat:
    threads:
      max: 200          # P7 的 R3 会用压测数据重新定这个值
    accept-count: 500

spring:
  application:
    name: peergrab
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/peer_grab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: ${PEERGRAB_MYSQL_PASSWORD:peergrab123456}
    hikari:
      # 连接池不是越大越好：HikariCP 官方建议 CPU 核数 * 2 + 磁盘数。
      # P7 的容量评估会用 10/50/100/200 的实测曲线验证这个结论。
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
      timeout: 500ms      # Redis 单节点故障时快速回源；ECS 隔离对照已验证 100 RPS 读负载

peergrab:
  ws:
    enabled: true
  worker-id: 1
  auth:
    # 生产默认 false：只认 Bearer token。谁把这个开关开进生产，
    # 等于任何人带个 X-User-Id 就能冒充任何人。
    allow-header-identity: false
    arbitrator-id: 9001
    demo:
      enabled: ${PEERGRAB_AUTH_DEMO_ENABLED:false}
      password-1001: ${PEERGRAB_AUTH_DEMO_PASSWORD_1001:}
      password-2001: ${PEERGRAB_AUTH_DEMO_PASSWORD_2001:}
      password-2002: ${PEERGRAB_AUTH_DEMO_PASSWORD_2002:}
      password-9001: ${PEERGRAB_AUTH_DEMO_PASSWORD_9001:}
    jwt-secret: ${PEERGRAB_AUTH_JWT_SECRET:}
    session-ttl-minutes: 120
    refresh-ttl-minutes: 10080    # P6：JWT refresh token，默认 7 天
  settle:
    commission-rate: 0.05
    auto-settle-seconds: 86400
  mq:
    enabled: true                 # 关掉则退化为纯兜底扫描，应用仍可用
    endpoints: 127.0.0.1:8081     # RocketMQ 5.x gRPC proxy
    topic:
      confirm-timeout: errand-confirm-timeout
  timeout:
    confirm-seconds: 300
    max-transfer-rounds: 5      # 防无限流转：超过则回退让所有人重新抢          # 生产 5 分钟；测试用 @TestPropertySource 压到 2 秒
    dispatch-sender-threads: 4   # 超时消息已持久化，后台即时发送失败由 worker 重发
    dispatch-queue-capacity: 2048

  grab:
    limit:
      type: sentinel            # P7：生产默认使用 Sentinel 热点参数限流；local 可切回单机固定窗口
      enabled: true             # P7：抢单 L1 热点限流
      per-second: 500           # 单实例、单任务每秒放行数，S2 阶梯加压后定参
      resource: peer_grab_grab

  credit:
    min-score: 40
    max-ongoing: 5
    calibration-cron: "0 0 3 * * ?"
    calibration-batch-size: 1000

  cache:
    enabled: true
    shards: 1                 # 当前单 Redis 实例；多片只增写放大，按压测再开启
    ttl-seconds: 600          # 物理 TTL 10 分钟
    jitter-seconds: 120       # ±2 分钟随机抖动，防雪崩（大批 key 同时到期）
    empty-ttl-seconds: 60     # 空值缓存 TTL，防穿透
    double-delete-ms: 500     # 延迟双删间隔
    double-delete-enabled: true
    double-delete-sender-threads: 2  # MQ 发送在有界后台池执行，避免 Broker 故障阻塞已提交写请求
    double-delete-queue-capacity: 2048
    bloom-enabled: false       # negative 仍要查 MySQL；默认关闭避免冷 miss 多次 Redis 访问
    redisson-pool-size: 16    # 与 Lettuce 池分开，避免叠加打满 Redis
    local-fallback-ttl-millis: 1000 # Redis 故障时仅短暂复用本进程已验证详情
    local-fallback-max-entries: 10000
  web:
    cors-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    com.peergrab: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,snowflakeLease
  endpoints:
    web:
      exposure:
        include: health,prometheus
